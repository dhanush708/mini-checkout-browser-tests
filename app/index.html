<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>North Ledger Stationery — Checkout</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-wrapper">
    <header>
      <h1>North Ledger Stationery</h1>
      <p class="store-subtitle">Carefully bound notebooks and desk supplies.</p>
    </header>

    <main class="layout-grid">
      <section aria-labelledby="catalog-heading">
        <h2 id="catalog-heading">Catalog</h2>
        <ul class="product-list" id="product-list">
          <!-- Populated by main.js from cart.js PRODUCTS -->
        </ul>
      </section>

      <section aria-labelledby="cart-heading" class="cart-section">
        <h2 id="cart-heading">Your Order</h2>
        
        <div id="cart-container">
          <p id="empty-cart-message" class="empty-cart-message">Your cart is empty.</p>
          <div class="table-responsive">
            <table id="cart-table" class="cart-table" hidden>
              <caption class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Items currently in your shopping cart</caption>
              <thead>
                <tr>
                  <th scope="col">Item</th>
                  <th scope="col" class="col-money">Price</th>
                  <th scope="col">Qty</th>
                  <th scope="col" class="col-money">Total</th>
                  <th scope="col"><span class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Actions</span></th>
                </tr>
              </thead>
              <tbody id="cart-items-body">
                <!-- Rendered rows -->
              </tbody>
            </table>
          </div>
        </div>

        <div class="order-total-bar">
          <span>Order total</span>
          <span data-testid="order-total" id="order-total-display">₹0.00</span>
        </div>

        <section class="checkout-section" aria-labelledby="checkout-heading">
          <h2 id="checkout-heading" style="border-bottom: none; margin-bottom: 12px;">Customer Details</h2>

          <div id="validation-errors" class="error-list" role="alert" hidden aria-live="polite">
            <!-- Validation errors dynamically populated -->
          </div>

          <form id="checkout-form" novalidate>
            <div class="form-group">
              <label for="customer-name">Full name</label>
              <input 
                type="text" 
                id="customer-name" 
                name="customerName" 
                maxlength="60" 
                autocomplete="name" 
                aria-required="true"
              >
            </div>

            <button type="submit" id="place-order-btn" class="btn-primary">Place Order</button>
          </form>

          <div id="confirmation-container"></div>
        </section>
      </section>
    </main>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
